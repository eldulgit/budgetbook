<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/css/style.css"/>
    <title>입력</title>
</head>
<body class="bg-light">
<div class="container-fluid">
    <div class="row">
        <!-- Mobile Navbar Header -->
        <header class="navbar navbar-dark bg-dark d-md-none px-3 py-2">
            <a class="navbar-brand fs-5" href="#"><i class="bi bi-wallet2 me-2"></i>가계부 관리</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#sidebar" aria-controls="sidebar" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
        </header>

        <!-- Sidebar Navigation -->
        <nav id="sidebar" class="col-md-3 col-lg-2 d-md-block bg-dark text-white sidebar collapse min-vh-100 p-3">
            <div class="position-sticky pt-3">
                <h4 class="text-white px-3 mb-4 d-none d-md-block"><i class="bi bi-wallet2 me-2"></i>가계부 관리</h4>
                <ul class="nav flex-column gap-2">
                    <li class="nav-item">
                        <a href="/records" class="nav-link text-white"><i class="bi bi-list-ul me-2"></i>내역</a>
                    </li>
                    <li class="nav-item">
                        <a href="/categories" class="nav-link text-white"><i class="bi bi-tags me-2"></i>카테고리</a>
                    </li>
                    <li class="nav-item">
                        <a href="/summary" class="nav-link text-white"><i class="bi bi-bar-chart-line me-2"></i>통계</a>
                    </li>
                </ul>
            </div>
        </nav>

        <!-- Main Content -->
        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4">
            <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                <h1 class="h2">새 내역 입력</h1>
            </div>

            <div class="row justify-content-center">
                <div class="col-md-8 col-lg-6">
                    <div class="card shadow-sm border-0">
                        <div class="card-body p-4">
                            <form action="/records" method="post" class="input-form" th:object="${recordForm}">
                                <div class="mb-3">
                                    <label class="form-label">날짜</label>
                                    <input type="date" th:field="*{date}" class="form-control"/>
                                    <div class="text-danger small" th:if="${#fields.hasErrors('date')}" th:errors="*{date}">
                                        날짜 오류
                                    </div>
                                </div>

                                <div class="mb-3">
                                    <label class="form-label">내역명</label>
                                    <input type="text" th:field="*{title}" class="form-control" placeholder="내역명 입력"/>
                                    <div class="text-danger small" th:if="${#fields.hasErrors('title')}" th:errors="*{title}">
                                        내역명 오류
                                    </div>
                                </div>

                                <div class="mb-3">
                                    <label class="form-label">금액</label>
                                    <input type="number" th:field="*{amount}" class="form-control" placeholder="금액 입력" min="1"/>
                                    <div class="text-danger small" th:if="${#fields.hasErrors('amount')}" th:errors="*{amount}">
                                        금액 오류
                                    </div>
                                </div>

                                <div class="mb-3">
                                    <label class="form-label">카테고리</label>
                                    <select th:field="*{categoryId}" class="form-select">
                                        <option value="">카테고리 선택</option>
                                        <option th:each="category : ${categories}"
                                                th:value="${category.id}"
                                                th:text="${category.name}">
                                            카테고리명
                                        </option>
                                    </select>
                                    <div class="text-danger small" th:if="${#fields.hasErrors('categoryId')}" th:errors="*{categoryId}">
                                        카테고리 오류
                                    </div>
                                </div>

                                <div class="mb-4">
                                    <label class="form-label d-block">구분</label>
                                    <div class="form-check form-check-inline">
                                        <input class="form-check-input" type="radio" th:field="*{type}" value="INCOME" id="income"/>
                                        <label class="form-check-label" for="income">수입</label>
                                    </div>
                                    <div class="form-check form-check-inline">
                                        <input class="form-check-input" type="radio" th:field="*{type}" value="EXPENSE" id="expense"/>
                                        <label class="form-check-label" for="expense">지출</label>
                                    </div>
                                    <div class="text-danger small" th:if="${#fields.hasErrors('type')}" th:errors="*{type}">
                                        구분 오류
                                    </div>
                                </div>

                                <div class="d-flex gap-2">
                                    <button type="submit" class="btn btn-primary flex-grow-1">추가</button>
                                    <a href="/records" class="btn btn-outline-secondary flex-grow-1 text-center">취소</a>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
