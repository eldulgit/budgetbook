<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/css/style.css"/>
    <title>카테고리</title>
</head>
<body class="bg-light">
<div class="container-fluid">
    <div class="row">
        <!-- Mobile Navbar Header -->
        <header class="navbar navbar-dark bg-dark d-md-none px-3 py-2">
            <a class="navbar-brand fs-5" href="#"><i class="bi bi-wallet2 me-2"></i>가계부 관리</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#sidebar" aria-controls="sidebar" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
        </header>

        <!-- Sidebar Navigation -->
        <nav id="sidebar" class="col-md-3 col-lg-2 d-md-block bg-dark text-white sidebar collapse min-vh-100 p-3">
            <div class="position-sticky pt-3">
                <h4 class="text-white px-3 mb-4 d-none d-md-block"><i class="bi bi-wallet2 me-2"></i>가계부 관리</h4>
                <ul class="nav flex-column gap-2">
                    <li class="nav-item">
                        <a href="/records" class="nav-link text-white"><i class="bi bi-list-ul me-2"></i>내역</a>
                    </li>
                    <li class="nav-item">
                        <a href="/categories" class="nav-link text-white active bg-primary rounded"><i class="bi bi-tags me-2"></i>카테고리</a>
                    </li>
                    <li class="nav-item">
                        <a href="/summary" class="nav-link text-white"><i class="bi bi-bar-chart-line me-2"></i>통계</a>
                    </li>
                </ul>
            </div>
        </nav>

        <!-- Main Content -->
        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4">
            <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                <h1 class="h2">카테고리 관리</h1>
            </div>

            <p th:if="${message}" th:text="${message}" class="alert alert-danger"></p>

            <div class="row g-4">
                <!-- Add Category Form Card -->
                <div class="col-md-4">
                    <div class="card shadow-sm border-0">
                        <div class="card-header bg-white py-3">
                            <h5 class="card-title mb-0">새 카테고리 추가</h5>
                        </div>
                        <div class="card-body">
                            <form class="category-form" action="/categories" method="post">
                                <div class="mb-3">
                                    <label class="form-label">카테고리명</label>
                                    <input type="text" name="name" class="form-control" placeholder="카테고리명 입력" required>
                                </div>
                                <div class="d-flex gap-2 category-buttons">
                                    <button type="submit" class="btn btn-primary flex-grow-1">추가</button>
                                    <button type="reset" class="btn btn-outline-secondary flex-grow-1">취소</button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>

                <!-- Category Table Card -->
                <div class="col-md-8">
                    <div class="card shadow-sm border-0">
                        <div class="card-header bg-white py-3">
                            <h5 class="card-title mb-0">카테고리 목록</h5>
                        </div>
                        <div class="card-body p-0">
                            <div class="table-responsive">
                                <table class="table table-hover align-middle mb-0">
                                    <thead class="table-light">
                                        <tr>
                                            <th class="ps-4">카테고리명</th>
                                            <th class="text-end pe-4">관리</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr th:each="category : ${categories}">
                                            <td class="ps-4 fw-medium" th:text="${category.name}">name</td>
                                            <td class="text-end pe-4">
                                                <form action="/categories/delete" method="post" class="d-inline">
                                                    <input type="hidden" name="id" th:value="${category.id}">
                                                    <button type="submit" class="btn btn-outline-danger btn-sm">삭제</button>
                                                </form>
                                            </td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
