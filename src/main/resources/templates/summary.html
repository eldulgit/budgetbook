<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/css/style.css"/>
    <title>통계</title>
</head>
<body class="bg-light">
<div class="container-fluid">
    <div class="row">
        <!-- Mobile Navbar Header -->
        <header class="navbar navbar-dark bg-dark d-md-none px-3 py-2">
            <a class="navbar-brand fs-5" href="#"><i class="bi bi-wallet2 me-2"></i>가계부 관리</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#sidebar" aria-controls="sidebar" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
        </header>

        <!-- Sidebar Navigation -->
        <nav id="sidebar" class="col-md-3 col-lg-2 d-md-block bg-dark text-white sidebar collapse min-vh-100 p-3">
            <div class="position-sticky pt-3">
                <h4 class="text-white px-3 mb-4 d-none d-md-block"><i class="bi bi-wallet2 me-2"></i>가계부 관리</h4>
                <ul class="nav flex-column gap-2">
                    <li class="nav-item">
                        <a href="/records" class="nav-link text-white"><i class="bi bi-list-ul me-2"></i>내역</a>
                    </li>
                    <li class="nav-item">
                        <a href="/categories" class="nav-link text-white"><i class="bi bi-tags me-2"></i>카테고리</a>
                    </li>
                    <li class="nav-item">
                        <a href="/summary" class="nav-link text-white active bg-primary rounded"><i class="bi bi-bar-chart-line me-2"></i>통계</a>
                    </li>
                </ul>
            </div>
        </nav>

        <!-- Main Content -->
        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4">
            <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                <h1 class="h2">재정 통계</h1>
            </div>

            <!-- Summary Cards Area -->
            <div class="row g-4 mb-4">
                <div class="col-md-4">
                    <div class="card shadow-sm border-0">
                        <div class="card-body">
                            <h6 class="text-muted mb-2">이번 달 수입</h6>
                            <h3 class="text-success fw-bold mb-0" th:text="${monthlyIncome != null ? #numbers.formatInteger(monthlyIncome, 0, 'COMMA') + '원' : '0원'}">0원</h3>
                        </div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="card shadow-sm border-0">
                        <div class="card-body">
                            <h6 class="text-muted mb-2">이번 달 지출</h6>
                            <h3 class="text-danger fw-bold mb-0" th:text="${monthlyExpense != null ? #numbers.formatInteger(monthlyExpense, 0, 'COMMA') + '원' : '0원'}">0원</h3>
                        </div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="card shadow-sm border-0">
                        <div class="card-body">
                            <h6 class="text-muted mb-2">이번 달 잔액</h6>
                            <h3 class="text-primary fw-bold mb-0" th:text="${monthlyBalance != null ? #numbers.formatInteger(monthlyBalance, 0, 'COMMA') + '원' : '0원'}">0원</h3>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Charts Area -->
            <div class="row g-4">

                <div class="col-md-6">
                    <div class="card shadow-sm border-0 h-100">
                        <div class="card-header bg-white py-3">
                            <h5 class="card-title mb-0">월별 지출량</h5>
                        </div>

                        <div class="card-body">
                            <div class="chart-container">
                                <canvas id="monthlyExpenseChart"></canvas>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="col-md-6">
                    <div class="card shadow-sm border-0 h-100">
                        <div class="card-header bg-white py-3">
                            <h5 class="card-title mb-0">한 달간 일별 누적량</h5>
                        </div>

                        <div class="card-body">
                            <div class="chart-container">
                                <canvas id="dailyTotalChart"></canvas>
                            </div>
                        </div>
                    </div>
                </div>

            </div>

            <div class="row g-4 mt-1">
                <div class="col-12">
                    <div class="card shadow-sm border-0">
                        <div class="card-header bg-white py-3">
                            <h5 class="card-title mb-0">카테고리별 지출</h5>
                        </div>

                        <div class="card-body">
                            <div class="chart-container category-chart-container">
                                <canvas id="categoryExpenseChart"></canvas>
                            </div>
                            <p class="text-muted text-center mb-0"
                               th:if="${categoryExpenses == null or categoryExpenses.isEmpty()}">
                                이번 달 지출 내역이 없습니다.
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script th:inline="javascript">
    /*<![CDATA[*/
    const monthlyLabels = /*[[${monthlyExpenses.keySet()}]]*/ [];
    const monthlyData = /*[[${monthlyExpenses.values()}]]*/ [];

    const monthlyCtx = document.getElementById('monthlyExpenseChart');

    new Chart(monthlyCtx, {
        type: 'bar',
        data: {
            labels: monthlyLabels,
            datasets: [{
                label: '월별 지출량',
                data: monthlyData,
                backgroundColor: 'rgba(13, 110, 253, 0.7)',
                borderColor: 'rgba(13, 110, 253, 1)',
                borderWidth: 1
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false
        }
    });

    const dailyLabels = /*[[${dailyExpenses.keySet()}]]*/ [];
    const dailyData = /*[[${dailyExpenses.values()}]]*/ [];

    const dailyCtx = document.getElementById('dailyTotalChart');

    new Chart(dailyCtx, {
        type: 'line',
        data: {
            labels: dailyLabels,
            datasets: [{
                label: '일별 누적 지출량',
                data: dailyData,
                fill: true,
                backgroundColor: 'rgba(25, 135, 84, 0.1)',
                borderColor: 'rgba(25, 135, 84, 1)',
                tension: 0.1
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false
        }
    });

    const categoryLabels = /*[[${categoryExpenses != null ? categoryExpenses.keySet() : null}]]*/ [] || [];
    const categoryData = /*[[${categoryExpenses != null ? categoryExpenses.values() : null}]]*/ [] || [];

    const categoryCtx = document.getElementById('categoryExpenseChart');

    new Chart(categoryCtx, {
        type: 'doughnut',
        data: {
            labels: categoryLabels,
            datasets: [{
                label: '카테고리별 지출',
                data: categoryData,
                backgroundColor: [
                    'rgba(220, 53, 69, 0.75)',
                    'rgba(13, 110, 253, 0.75)',
                    'rgba(25, 135, 84, 0.75)',
                    'rgba(255, 193, 7, 0.75)',
                    'rgba(111, 66, 193, 0.75)',
                    'rgba(13, 202, 240, 0.75)'
                ],
                borderColor: '#ffffff',
                borderWidth: 2
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
                legend: {
                    position: 'bottom'
                }
            }
        }
    });
    /*]]>*/
</script>
</body>
</html>
