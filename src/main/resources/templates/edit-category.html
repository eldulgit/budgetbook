<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/css/style.css"/>
    <title>카테고리 수정</title>
</head>
<body class="bg-light">
<div class="container-fluid">
    <div class="row">
        <header class="navbar navbar-dark bg-dark d-md-none px-3 py-2">
            <a class="navbar-brand fs-5" href="#"><i class="bi bi-wallet2 me-2"></i>가계부 관리</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#sidebar" aria-controls="sidebar" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
        </header>

        <nav id="sidebar" class="col-md-3 col-lg-2 d-md-block bg-dark text-white sidebar collapse min-vh-100 p-3">
            <div class="position-sticky pt-3">
                <h4 class="text-white px-3 mb-4 d-none d-md-block"><i class="bi bi-wallet2 me-2"></i>가계부 관리</h4>
                <ul class="nav flex-column gap-2">
                    <li class="nav-item">
                        <a href="/records" class="nav-link text-white"><i class="bi bi-list-ul me-2"></i>내역</a>
                    </li>
                    <li class="nav-item">
                        <a href="/categories" class="nav-link text-white active bg-primary rounded"><i class="bi bi-tags me-2"></i>카테고리</a>
                    </li>
                    <li class="nav-item">
                        <a href="/summary" class="nav-link text-white"><i class="bi bi-bar-chart-line me-2"></i>통계</a>
                    </li>
                </ul>
            </div>
        </nav>

        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4">
            <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                <h1 class="h2">카테고리 수정</h1>
            </div>

            <div class="row justify-content-center">
                <div class="col-md-8 col-lg-6">
                    <div class="card shadow-sm border-0">
                        <div class="card-body p-4">
                            <form action="/categories/update" method="post" class="category-form">
                                <input type="hidden" name="id" th:value="${category.id}">

                                <div class="mb-3">
                                    <label class="form-label">카테고리명</label>
                                    <input type="text" name="name" class="form-control" th:value="${category.name}" required>
                                </div>

                                <div class="d-flex gap-2 category-buttons">
                                    <button type="submit" class="btn btn-primary flex-grow-1">수정완료</button>
                                    <a href="/categories" class="btn btn-outline-secondary flex-grow-1 text-center">취소</a>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
